name: CI

# Runs the same checks as scripts/preflight.sh, with the database section
# actually enforced rather than skipped. A local preflight that skipped the
# SQL suite has not made the promise this workflow makes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest

    # Postgres 16 to match the version the schema is written against.
    # Scratch database, thrown away with the runner.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: derm_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/derm_tracker_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      # The runner image ships a psql client; make sure it is the 16 line
      # so client and server do not disagree about anything.
      - name: Install Postgres 16 client
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          psql --version

      # Invoked through bash rather than as ./scripts/preflight.sh. This repo
      # is committed from Windows, where NTFS has no executable bit, so git
      # resets the file to 100644 on every `git add -A` and the direct call
      # dies with "permission denied". Calling the interpreter does not care.
      - name: Preflight
        run: bash ./scripts/preflight.sh --require-db
