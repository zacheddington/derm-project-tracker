name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "prototype/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Least privilege: read the repo, write only the Pages artifact.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - run: npm ci

      # A project site is served from /<repo-name>/, so the base path is
      # derived from the repo rather than hardcoded. Renaming the repo
      # then cannot silently break every asset URL.
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      # Pages serves no SPA fallback. This app has no routing today, but
      # copying index.html to 404.html means a deep link keeps working if
      # routing is ever added.
      - name: Add 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
